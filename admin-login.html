<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 登录</title>
    <meta name="description" content="北京精恒光辉门窗有限公司后台管理系统">
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <span class="logo-text">精恒光辉</span>
                </div>
                <h1 class="login-title">后台管理系统</h1>
                <p class="login-subtitle">请输入管理员账号和密码</p>
            </div>

            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="username">管理员账号</label>
                    <input type="text" id="username" name="username" placeholder="请输入管理员账号" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me">
                        <span class="checkmark"></span>
                        记住我
                    </label>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">登录</span>
                    <span class="btn-loading" style="display: none;">登录中...</span>
                </button>

                <div class="login-footer">
                    <p>如有问题请联系系统管理员</p>
                </div>
            </form>

            <div class="error-message" id="error-message" style="display: none;"></div>
        </div>

        <div class="login-background">
            <div class="background-overlay"></div>
        </div>
    </div>

    <script src="admin-login.js"></script>
</body>
</html>
