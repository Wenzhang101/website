<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 客户信息管理</title>
    <meta name="description" content="北京精恒光辉门窗有限公司后台管理系统">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
        }

        .admin-header {
            background: white;
            border-bottom: 1px solid #e8e8ed;
            padding: 0 20px;
        }

        .admin-nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-logo .logo-text {
            font-size: 20px;
            font-weight: 600;
            color: #0071e3;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .admin-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-panel {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .panel-header {
            padding: 30px;
            border-bottom: 1px solid #e8e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #0071e3;
            color: white;
        }

        .data-table-container {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e8e8ed;
        }

        .data-table th {
            background: #f5f5f7;
            font-weight: 600;
            color: #1d1d1f;
            font-size: 14px;
        }

        .data-table td {
            color: #424245;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }

        .btn-danger {
            background: #ff3b30;
            color: white;
            border: none;
        }

        .panel-footer {
            padding: 20px 30px;
            background: #f5f5f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats {
            color: #86868b;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #86868b;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .stat-card {
            background: #f5f5f7;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #0071e3;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #86868b;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 头部导航 -->
    <header class="admin-header">
        <nav class="admin-nav">
            <div class="admin-logo">
                <span class="logo-text">精恒光辉</span>
                <span style="color: #86868b; font-size: 14px;">后台管理系统</span>
            </div>
            <div class="admin-user">
                <div class="user-info">
                    <div class="user-name" id="current-user">管理员</div>
                    <div class="user-role">系统管理员</div>
                </div>
                <button class="logout-btn" id="logout-btn">
                    <span>退出登录</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- 主要内容 -->
    <main class="admin-main">
        <!-- 客户信息管理面板 -->
        <div class="admin-panel">
            <div class="panel-header">
                <h2>客户信息管理</h2>
                <div class="panel-actions">
                    <button class="btn btn-primary" id="refresh-data">
                        <span>刷新数据</span>
                    </button>
                </div>
            </div>

            <div class="data-table-container">
                <table class="data-table" id="customer-table">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>电话</th>
                            <th>邮箱</th>
                            <th>咨询类型</th>
                            <th>咨询时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="customer-table-body">
                        <!-- 数据将通过JavaScript动态填充 -->
                    </tbody>
                </table>
            </div>

            <div class="panel-footer">
                <div class="stats">
                    <span>总计: <span id="total-count">0</span> 条记录</span>
                </div>
            </div>
        </div>

        <!-- 数据统计面板 -->
        <div class="admin-panel">
            <div class="panel-header">
                <h2>数据统计</h2>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="total-customers">0</div>
                    <div class="stat-label">总客户数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="today-customers">0</div>
                    <div class="stat-label">今日新增</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="window-customers">0</div>
                    <div class="stat-label">门窗咨询</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="sunroom-customers">0</div>
                    <div class="stat-label">阳光房咨询</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 简单的后台管理系统
        class SimpleAdminManager {
            constructor() {
                this.storageKey = 'jingheng_customers';
                this.sessionKey = 'admin_logged_in';
                this.init();
            }

            init() {
                // 检查登录状态
                if (!this.checkAuth()) {
                    window.location.href = 'admin-login-final.html';
                    return;
                }

                this.bindEvents();
                this.refreshData();
            }

            checkAuth() {
                return sessionStorage.getItem(this.sessionKey) || localStorage.getItem(this.sessionKey);
            }

            bindEvents() {
                // 刷新数据按钮
                document.getElementById('refresh-data').addEventListener('click', () => {
                    this.refreshData();
                });

                // 退出登录按钮
                document.getElementById('logout-btn').addEventListener('click', () => {
                    this.logout();
                });
            }

            refreshData() {
                const customers = this.loadCustomers();
                this.renderCustomerTable(customers);
                this.updateStatistics(customers);
            }

            loadCustomers() {
                const stored = localStorage.getItem(this.storageKey);
                return stored ? JSON.parse(stored) : [];
            }

            renderCustomerTable(customers) {
                const tableBody = document.getElementById('customer-table-body');
                const totalCount = document.getElementById('total-count');

                tableBody.innerHTML = '';
                totalCount.textContent = customers.length;

                if (customers.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align: center; color: #86868b; padding: 40px;">
                                <div class="empty-state">
                                    <div class="icon">📭</div>
                                    <div>暂无客户数据</div>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                customers.forEach(customer => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${this.escapeHtml(customer.name)}</td>
                        <td>${this.escapeHtml(customer.phone)}</td>
                        <td>${customer.email ? this.escapeHtml(customer.email) : '-'}</td>
                        <td>${customer.type ? this.escapeHtml(customer.type) : '-'}</td>
                        <td>${this.escapeHtml(customer.timestamp)}</td>
                        <td class="action-buttons">
                            <button class="btn btn-small btn-danger" onclick="adminManager.deleteCustomer('${customer.id}')">删除</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            updateStatistics(customers) {
                const today = new Date().toDateString();
                const todayCustomers = customers.filter(customer => {
                    const customerDate = new Date(customer.timestamp).toDateString();
                    return customerDate === today;
                });

                const windowCustomers = customers.filter(customer =>
                    customer.type === '断桥铝门窗'
                );

                const sunroomCustomers = customers.filter(customer =>
                    customer.type === '阳光房'
                );

                document.getElementById('total-customers').textContent = customers.length;
                document.getElementById('today-customers').textContent = todayCustomers.length;
                document.getElementById('window-customers').textContent = windowCustomers.length;
                document.getElementById('sunroom-customers').textContent = sunroomCustomers.length;
            }

            deleteCustomer(id) {
                if (confirm('确定要删除这条客户记录吗？')) {
                    const customers = this.loadCustomers();
                    const updatedCustomers = customers.filter(customer => customer.id !== id);
                    localStorage.setItem(this.storageKey, JSON.stringify(updatedCustomers));
                    this.refreshData();
                    alert('客户记录已删除');
                }
            }

            logout() {
                if (confirm('确定要退出登录吗？')) {
                    sessionStorage.removeItem(this.sessionKey);
                    localStorage.removeItem(this.sessionKey);
                    window.location.href = 'admin-login-final.html';
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // 全局初始化
        document.addEventListener('DOMContentLoaded', function() {
            window.adminManager = new SimpleAdminManager();
        });
    </script>
</body>
</html>
